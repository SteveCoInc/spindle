name: CI
on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Rust checks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: make bootstrap check test
  integration:
    name: Storage integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust
        run: rustup toolchain install 1.93.0 --profile minimal
      - run: make up test-integration
      - name: Service logs
        if: failure()
        run: docker compose -p spindle-dev -f infra/compose.yaml logs --tail=100
      - run: make down
        if: always()
