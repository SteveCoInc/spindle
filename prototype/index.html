{"id": "N-1", "title": "Redact requester_email values", "text": "When redacting PII, keep requester_email as a schema name but remove its actual value from shared notes.", "kind": "Decision", "author": "Avery", "sources": ["S-104"], "tags": ["pii", "redaction"], "folder": "/decisions/privacy", "valid": "Current", "status": "Current", "uses": 0, "revision": 1},
{"id": "N-2", "title": "Exclude YubiKey OTP tokens", "text": "When redacting PII and authentication material, exclude 44-character YubiKey modhex OTP values.", "kind": "Decision", "author": "Avery", "sources": ["S-104"], "tags": ["pii", "redaction"], "folder": "/decisions/privacy", "valid": "Current", "status": "Current", "uses": 0, "revision": 1},
{"id": "N-3", "title": "Keep aggregate metrics, omit personal names", "text": "When redacting PII, retain aggregate support metrics but exclude names attached to individual customer records.", "kind": "Decision", "author": "Avery", "sources": ["S-106"], "tags": ["pii", "redaction"], "folder": "/decisions/privacy", "valid": "Current", "status": "Current", "uses": 0, "revision": 1},
{id:'N-104',title:'Deduplicate support events by event_id, not customer_id',text:'In models/support_events_gold.sql, partition by event_id and keep the row with the latest ingested_at. Replays can resend the same event; customer_id is not unique and would drop legitimate events for repeat customers. Verified against replay fixture replay_2026_11_03.json.',kind:'Decision',author:'Avery',sources:['S-104'],graphRefs:[{id:'ctx:redshift:analytics.support.support_events_gold',kind:'Redshift table',name:'analytics.support.support_events_gold',relation:'applies_to'}],tags:['dedup','support_events_gold'],folder:'/decisions/quality',valid:'Nov 3 onward',status:'Current',uses:12,citations:3,revision:1},
{id:'N-107',title:'Agent export excludes requester_email and ticket_body',text:'Before publishing s3://demo-agent-data/support/events/, select only event_id, pseudonymous_customer_id, event_type, event_time, and response_latency_ms. Drop requester_email, requester_phone, and ticket_body. Derive pseudonymous_customer_id using the approved HMAC service; never put its key in project notes.',kind:'Constraint',author:'Jordan',sources:['S-108'],tags:['privacy','agent-export'],folder:'/decisions/privacy',attrs:{dataset:'support_events_gold',pii:'excluded'},valid:'Nov 4 onward',status:'Current',uses:8,citations:2,revision:1},
{id:'N-103',title:'Freshness uses MAX(event_time); ingestion time hides late data',text:'Compute dataset freshness as now() - MAX(event_time) over support_events_gold. MAX(ingested_at) is unsuitable: a replay received at 09:00 can contain only yesterday’s events. Agent responses must label the dataset stale when event-time lag exceeds 30 minutes.',previous:'Use MAX(ingested_at) as the dataset freshness watermark.',kind:'Decision',author:'Avery',correctedBy:'Avery',correctionCount:2,readsAfterCorrection:7,sources:['S-106'],tags:['freshness','watermark'],folder:null,valid:'Nov 5 onward',status:'Corrected',uses:9,citations:3,revision:3},
{id:'N-112',title:'response_latency_ms excludes bot replies and negative durations',text:'For each ticket, take the first human reply after ticket_created_at. response_latency_ms = human_reply_at - ticket_created_at in milliseconds. Ignore reply_kind=bot and quarantine rows with negative duration; do not silently clamp them to zero.',kind:'Definition',author:'Sam',sources:['S-112'],tags:['metrics','schema'],folder:null,valid:'Nov 5 onward',status:'Current',uses:6,citations:1,revision:1},
{id:'B-201',title:'Add an event_id replay regression test',text:'Run the same 1,000-event fixture twice. The gold dataset must still contain exactly 1,000 unique event_id values. Attach the test result before marking done.',kind:'Task',author:'Sam',sources:[],attrs:{suite:'replay_events'},tags:['dedup','validation'],folder:'/delivery/tests',valid:'Unknown',status:'Current',workStatus:'In progress',uses:0,revision:1},
{id:'B-202',title:'Verify the exported schema contains no direct PII fields',text:'Assert requester_email, requester_phone, and ticket_body are absent from every exported Parquet file. Inspect a synthetic fixture; never put real customer data in the board.',kind:'Task',author:'Jordan',sources:[],tags:['privacy','validation'],folder:'/delivery/security',valid:'Unknown',status:'Current',workStatus:'Ready',uses:0,revision:1},
{id:'B-301',title:'Publish support_events_gold v1 for the analysis agent',text:'Release only after replay deduplication, export-schema checks, and a freshness test on deliberately late events all pass. Link validation artifacts rather than inferring completion from activity.',kind:'Milestone',author:'Avery',sources:[],tags:['release'],folder:'/milestones',valid:'Unknown',status:'Current',workStatus:'Blocked',dependency:'B-201',uses:0,revision:1}
];
const seed=()=>({project:'agent-support',projects:[{id:'agent-support',name:'Agent-ready Support Data',goal:'Publish a fresh, deduplicated, PII-safe support dataset that an analysis agent can query with consistent metric definitions.',blueprint:1,board:true,active:true,archived:false,notes:initialNotes(),members:['Avery','Sam','Jordan'],exposures:35,citations:9,helpful:5,corrections:2,sessions:['S-104','S-108','S-106','S-112'],steering:'Check freshness definitions, agent-export PII exclusions, and replay deduplication assumptions.',extractionFocus:'Keep dataset contracts, transformation decisions, quality checks, freshness limits, and corrections. Ignore routine coding chatter.',guardrails:{email:true,phone:true,secret:true},nightDone:false,subscribed:false,feedback:{},privacy:'Credentials, API keys, personal identifiers, and private conversations',role:'Data platform lead — prioritize dataset contracts and validated corrections.',events:[]}],page:'overview'});
let state;try{state=JSON.parse(localStorage.getItem('aws-context-spindle-v8') || localStorage.getItem('aws-context-spindle-v7'))}catch{}if(!state?.projects?.length)state=seed();state.page='cli';
let modalKind='',lastFocus,blueprintChoice=0,noteFilter='All notes',query='',searchMode='overlay',folderFilter='/',tagFilter='',cliScene=0,cliOutput='',runTimer,toastTimer;
const P=()=>state.projects.find(p=>p.id===state.project);const save=()=>{try{localStorage.setItem('aws-context-spindle-v8',JSON.stringify(state))}catch{}};
const avatar=(name)=>`<span class="avatar ${name==='Avery'?'a':name==='Sam'?'s':name==='Jordan'?'j':'n'}">${esc(name.slice(0,2).toUpperCase())}</span>`;
const pill=(text,cls='')=>`<span class="pill ${cls}">${esc(text)}</span>`;
const button=(text,action,cls='',icon='')=>`<button class="btn ${cls}" data-action="${action}">${icon?I(icon):''}${text}</button>`;

function heading(title,sub,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p>${sub}</p></div><div class="heading-actions">${actions}</div></div>`}
function noteRow(n){return `<div class="note-row" role="button" tabindex="0" data-action="note:${n.id}"><div class="note-symbol">${I(n.kind==='Insight'?'spark':n.kind==='Constraint'?'shield':'notes')}</div><div>${pill(n.kind,n.kind==='Insight'?'purple':n.kind==='Constraint'?'blue':'')}<h3>${esc(n.title)}</h3><div class="meta"><span>${esc(n.author)}</span><span>·</span><span>${n.sources.length} source${n.sources.length===1?'':'s'}</span><span>·</span><span>${n.uses} retrievals</span>${n.status!=='Current'?pill(n.status,'warn'):''}</div></div>${I('chev').replace('<svg','<svg class="small-arrow"')}</div>`}
function metrics(){const p=P();return `<div class="metrics">${[[p.notes.filter(n=>!n.retracted).length,'Shared notes','notes','Grounded in your team’s work'],[p.exposures,'Teammate retrievals','people','<b>Exposure</b>, not assumed usefulness'],[p.citations,'Observed citations','link','Evidence of downstream use'],[p.corrections,'Corrections made','check','Better context, over time']].map(([v,l,i,s])=>`<div class="metric"><div class="metric-label">${l}${I(i)}</div><div class="metric-value">${v}<span style="font-size:11px;color:#9ca48f;margin-left:9px;font-family:'DM Sans';letter-spacing:0">${l==='Shared notes'?'active':''}</span></div><small>${s}</small></div>`).join('')}</div>`}
function view(){if(state.page==='connections')return connectionView();const p=P();if(state.page==='overview')return overview();if(state.page==='notes')return boardView();if(state.page==='cli')return cliView();if(state.page==='sessions')return sessionsView();if(state.page==='board')return boardView();if(state.page==='impact')return impactView();return nightView()}
function notesView(){return heading('Project notes','Search extracted decisions, constraints, and source evidence.',button('Add a note','new-note','','plus'))+`<div class="searchbar">${I('search')}<label class="sr-only" for="note-search">Search notes</label><input id="note-search" type="search" placeholder="Search decisions, insights, people…" value="${esc(query)}"><label class="sr-only" for="search-mode">Search scope</label><select id="search-mode"><option value="overlay" ${searchMode==='overlay'?'selected':''}>Project + allowed context</option><option value="project" ${searchMode==='project'?'selected':''}>This project only</option><option value="general" ${searchMode==='general'?'selected':''}>Allowed general context</option></select></div><div class="tabs" role="group" aria-label="Filter notes">${['All notes','Decisions','Insights','Needs review','Mine'].map(x=>`<button data-action="filter:${x}" class="${noteFilter===x?'active':''}">${x}</button>`).join('')}</div><div id="note-results">${noteResults()}</div>`}
function noteResults(){const p=P();let ns=searchMode==='general'?[]:p.notes.filter(n=>!n.retracted);ns=ns.filter(n=>(noteFilter!=='Decisions'||n.kind==='Decision')&&(noteFilter!=='Insights'||n.kind==='Insight')&&(noteFilter!=='Needs review'||n.status.includes('review'))&&(noteFilter!=='Mine'||n.author==='Avery')&&`${n.title} ${n.text} ${n.tags.join(' ')} ${n.author}`.toLowerCase().includes(query.toLowerCase()));return `<div class="section-head"><span class="muted" style="font-size:11px">${ns.length} note${ns.length!==1?'s':''} · ${searchMode==='project'?'Project knowledge':searchMode==='general'?'No general-context fixtures in this demo':'Project notes prioritized · permitted context only'}</span><span class="pill">${blueprintLabel(p)}</span></div><div class="card">${ns.map(noteRow).join('')||'<div class="empty"><h2>No matching notes</h2><p>Try a different search, filter, or project scope.</p></div>'}</div>`}

function openModal(title,body,foot='',wide=false){lastFocus=document.activeElement;document.getElementById('overlay').innerHTML=`<div class="backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-head"><h2 id="modal-title">${title}</h2><button class="icon-btn" data-action="close" aria-label="Close dialog">${I('close')}</button></header><div class="modal-body">${body}</div>${foot?`<footer class="modal-foot">${foot}</footer>`:''}</section></div>`;setTimeout(()=>document.querySelector('.modal input,.modal textarea,.modal button')?.focus(),20)}
function closeModal(){document.getElementById('overlay').innerHTML='';modalKind='';if(lastFocus?.isConnected)lastFocus.focus()}
function createModal(){modalKind='create';openModal('Create project',`<p class="muted" style="font-size:13px">Select a blueprint and specify the project goal.</p><div class="blueprints">${blueprints.map((b,i)=>`<button class="blueprint ${blueprintChoice===i?'selected':''}" data-action="blueprint:${i}" aria-pressed="${blueprintChoice===i}">${I(b.icon)}${blueprintChoice===i?`<span class="tick">${I('check')}</span>`:''}<h3>${b.name}</h3><p>${b.desc}</p></button>`).join('')}</div><label class="field"><span>Project name</span><input id="new-name" placeholder="e.g. Agent-ready Support Data" maxlength="80" value="${esc(window.draftName||'')}"></label><label class="field"><span>What are you working toward?</span><textarea id="new-goal" maxlength="600" placeholder="e.g. Build a fresh, PII-safe support dataset for agents.">${esc(window.draftGoal||'')}</textarea></label><details class="details"><summary>What this blueprint will remember</summary><p>${blueprints[blueprintChoice].focus} Blueprint v1 is copied into your project; you can refine it later.</p></details><div class="callout" style="font-size:11px">Extracted notes are shared with invited project members. Personal exclusions always apply. You’re the only member to start.</div><div id="create-error" class="form-error" role="alert"></div>`, `<span class="muted" style="font-size:11px">Blueprint defaults can be overridden later.</span>${button('Create project','create-confirm','primary','arrow')}`)}
function noteModal(id){const n=P().notes.find(n=>n.id===id);if(!n)return;modalKind='note';const retired=n.retracted;openModal('Note details',`<div class="label-row">${pill(n.kind,n.kind==='Insight'?'purple':'')}${pill(retired?'Retracted':n.status,retired?'warn':'dot')}<span class="muted" style="font-size:10px;margin-left:auto">${esc(n.id)} · revision ${n.revision}</span></div><h2 class="detail-title">${esc(n.title)}</h2>${itemBadges(n)}<p class="detail-copy">${retired?'This note is no longer active. Its source history is retained for audit.':esc(n.text)}</p><div class="detail-grid"><div><small>Contributed by</small><span>${esc(n.author)}</span></div><div><small>Valid time</small><span>${esc(n.valid)}</span></div><div><small>Shared with</small><span>Members of ${esc(P().name)}</span></div><div><small>Observed use</small><span>${n.uses} retrievals · not proof of usefulness</span></div></div>${graphReferences(n)}<div class="section-head"><h3>Supporting evidence</h3>${pill(`${n.sources.length} source references`)}</div>${n.sources.map(s=>`<div class="source">${I('terminal')}<div><strong style="font-size:11px">${esc(s)} · ${esc(sourceLabel(s))}</strong><small>${sessionInfo[s]?.author==='Avery'?'Your source session · private to you':s.startsWith('S-')?'Source reference only · transcript private to its author':'Direct contribution · no fabricated source evidence'}</small></div>${sessionInfo[s]?.author==='Avery'?`<span class="spacer"></span><button class="text-btn" data-action="session:${s}">Inspect</button>`:''}</div>`).join('')||'<p class="muted">Authored directly. No extracted source is claimed.</p>'}<details class="details"><summary>Organization & note history</summary><p>Folder: ${esc(n.folder||'Not placed')}<br>Tags: ${n.tags.map(esc).join(', ')||'None'}<br>Recorded: ${n.recorded||'Nov 2, 09:14'} · Valid time is separate from recorded time.<br>${n.previous?'Previous text: '+esc(n.previous):'Original version retained; no prior correction in this demo.'}${n.attrs?'<br>Custom attributes: '+esc(JSON.stringify(n.attrs)):''}${n.dependency?'<br>Work depends on: '+esc(P().notes.find(x=>x.id===n.dependency)?.title||n.dependency)+' (operational, not derivation)':''}</p>${!retired?button('Edit kind, tags & attributes','metadata:'+id):''}${P().board&&!retired?`<button class="text-btn" style="margin-top:12px" data-action="move:${id}">Move to a folder ${I('arrow')}</button>`:''}</details>`,retired?button('Close','close'): `<div class="label-row">${button(P().feedback[id]==='helpful'?'✓ Helpful':'Helpful',`feedback:${id}:helpful`)}${button(P().feedback[id]==='flagged'?'✓ Flagged':'Flag an issue',`feedback:${id}:flagged`)}</div>${n.author==='Avery'?`<div class="label-row">${button('Retract',`retract-note:${id}`,'danger')}${button('Correct note',`correct:${id}`,'','notes')}</div>`:button('Close','close')}`,true)}
function settingsModal(){const p=P();openModal('Project settings',`<span class="eyebrow">${blueprintLabel(p)} · blueprint v1</span><label class="field"><span>Project name</span><input id="edit-name" value="${esc(p.name)}" maxlength="80"></label><label class="field"><span>Shared goal</span><textarea id="edit-goal" maxlength="600">${esc(p.goal)}</textarea></label><label class="field"><span>Shared extraction & curation focus</span><textarea id="edit-extraction" maxlength="1200">${esc(p.extractionFocus||blueprints[p.blueprint].focus)}</textarea><small>Which decisions, constraints, findings, or uncertainties should this project retain? Personal exclusions always take precedence.</small></label><div class="callout">Project overrides stay with this project. Updating a stock blueprint will not silently overwrite them.</div><div class="source">${I('people')}<div><strong>Members</strong><small>${p.members.map(esc).join(', ')}</small></div><span class="spacer"></span><button class="text-btn" data-action="invite">Manage</button></div><div class="source">${I('shield')}<div><strong>Project guardrails</strong><small>Filter PII and credentials before sharing</small></div><span class="spacer"></span><button class="text-btn" data-action="guardrails">Configure</button></div><div class="source">${I('shield')}<div><strong>Personal privacy & contribution focus</strong><small>Personal rules cannot be relaxed by a project</small></div><span class="spacer"></span><button class="text-btn" data-action="privacy">Edit</button></div><details class="details"><summary>Project lifecycle</summary><p>Leaving stops capture for future sessions. Archiving also stops new contributions while retaining existing notes and provenance for reading.</p><div class="label-row" style="margin-top:15px">${button(p.active?'Leave active project':'Activate project',p.active?'leave':'activate')}${button(p.archived?'Restore project':'Archive project',p.archived?'restore':'archive','danger')}</div></details>`,`${button('C function boardView(){const p=P(),active=p.notes.filter(n=>!n.retracted),q=query.toLowerCase();const pathOf=n=>n.folder||'/notes';const match=n=>(n.title+' '+n.text+' '+n.tags.join(' ')+' '+JSON.stringify(n.attrs||{})+' '+(n.workStatus||n.status)).toLowerCase().includes(q);const tree={children:{},count:0};for(const n of active){let node=tree;node.count++;for(const part of pathOf(n).split('/').filter(Boolean)){node.children[part]??={children:{},count:0};node=node.children[part];node.count++}}const paths=[];const draw=(node,path='',depth=0)=>Object.entries(node.children).sort(([a],[b])=>a.localeCompare(b)).map(([name,child])=>{const full=path+'/'+name;paths.push(full);const children=Object.keys(child.children).length;return `<div class="folder-node">${children?`<details ${depth===0?'open':''}><summary aria-label="Expand ${esc(full)}">${I('chev')}<button class="folder-select ${folderFilter===full?'chosen':''}" data-action="board-folder:${encodeURIComponent(full)}">${I('folder')}<span>${esc(name)}</span><small>${child.count}</small></button></summary><div class="folder-branches">${draw(child,full,depth+1)}</div></details>`:`<button class="folder-select leaf ${folderFilter===full?'chosen':''}" data-action="board-folder:${encodeURIComponent(full)}">${I('folder')}<span>${esc(name)}</span><small>${child.count}</small></button>`}</div>`}).join('');const folders=draw(tree);if(folderFilter!=='/'&&!paths.includes(folderFilter))folderFilter='/';const ns=active.filter(n=>match(n)&&(folderFilter==='/'||pathOf(n)===folderFilter||pathOf(n).startsWith(folderFilter+'/')));const size=20;boardPage=Math.max(0,Math.min(boardPage,Math.max(0,Math.ceil(ns.length/size)-1)));const shown=ns.slice(boardPage*size,(boardPage+1)*size);const bullets=[];const corrected=active.find(n=>n.status==='Corrected');if(corrected)bullets.push([corrected.id,`${corrected.author} corrected “${corrected.title}” — revision ${corrected.revision}.`]);const task=active.find(n=>n.kind==='Task');if(task)bullets.push([task.id,`${task.author} updated “${task.title}” — ${task.workStatus||task.status}.`]);const linked=active.find(n=>n.graphRefs?.length);if(linked)bullets.push([linked.id,`The deduplication decision references the Redshift table ${linked.graphRefs[0].name}.`]);if(!bullets.length&&active.length)bullets.push([active[0].id,`${active[0].author} contributed “${active[0].title}”.`]);return heading('Project Board','Browse the structure. Open an item for its full context.',button('Add an item','new-note','primary','plus'))+`<section class="board-highlights"><div><h3>Highlights</h3><small>${p.id==='agent-support'?'Illustrative recent activity':'Current demo activity'}</small></div><ul>${bullets.map(([id,t])=>`<li><button data-action="note:${id}">${esc(t)}</button></li>`).join('')||'<li>No activity yet. Shared notes will appear here.</li>'}</ul></section><div class="searchbar">${I('search')}<input id="board-search" aria-label="Find board items" placeholder="Search notes, tags, status, or attributes…" value="${esc(query)}"></div><div class="board-browser"><aside class="folder-browser" aria-label="Board folders"><div class="folder-caption">Folders <small>includes descendants</small></div><button class="folder-select ${folderFilter==='/'?'chosen':''}" data-action="board-folder:%2F">${I('board')}<span>All items</span><small>${active.length}</small></button>${folders}</aside><section class="board-results"><div class="board-results-head"><strong>${folderFilter==='/'?'All items':esc(folderFilter)}</strong><small>${ns.length} matching · select an item to inspect</small></div><div class="compact-items">${shown.map(n=>{const status=n.workStatus||n.status,tone=/done|current/i.test(status)?'green':/blocked|review/i.test(status)?'amber':/progress/i.test(status)?'blue':'neutral';return `<button class="compact-note" data-action="note:${n.id}"><span class="compact-icon">${I(isKnowledge(n)?'notes':'check')}</span><div class="compact-copy"><strong>${esc(n.title)}</strong><small>${esc(n.id)} · ${esc(pathOf(n))} · ${esc(n.author)}</small><div class="compact-badges"><span class="attribute ${tone}">${esc(status)}</span>${n.tags.slice(0,2).map(t=>`<span class="tag">#${esc(t)}</span>`).join('')}${n.graphRefs?.length?`<span class="graph-badge">${I('database')} ${n.graphRefs.length} graph reference</span>`:''}${Object.entries(n.attrs||{}).slice(0,1).map(([k,v])=>`<span class="attribute">${esc(k)}: ${esc(String(v))}</span>`).join('')}</div></div>${I('chev')}</button>`}).join('')||'<div class="empty">No matching items in this folder.</div>'}</div><div class="board-pagination"><span>${ns.length?boardPage*size+1:0}–${Math.min((boardPage+1)*size,ns.length)} of ${ns.length}</span><button data-action="board-page:prev" ${boardPage===0?'disabled':''}>Previous</button><button data-action="board-page:next" ${(boardPage+1)*size>=ns.length?'disabled':''}>Next</button></div></section></div>`}
function graphReferences(n){return `<section class="graph-references"><div class="section-head"><h3>AWS Context graph references</h3>${pill('Optional relationships')}</div>${n.graphRefs?.length?graphMini()+n.graphRefs.map((ref,i)=>`<button class="graph-reference" data-action="graph-ref:${n.id}:${i}">${I('database')}<div><strong>${esc(ref.name)}</strong><small>${esc(ref.relation)} → ${esc(ref.kind)} · ${esc(ref.id)}</small></div>${I('arrow')}</button>`).join(''):'<p class="muted">No graph references. Notes can stand on their own.</p>'}<p class="muted" style="font-size:11px;margin-top:10px">A relationship links this note to an existing graph entity. It is separate from the source evidence supporting the note; linking does not copy the resource or prove the claim.</p></section>`}
function graphReferenceModal(id,index){const n=P().notes.find(n=>n.id===id),ref=n?.graphRefs?.[index];if(!ref)return;openModal('AWS Context graph · referenced entity',`${pill(ref.kind)}<h2 class="detail-title">${esc(ref.name)}</h2><p class="muted">Illustrative graph entity · ${esc(ref.id)}</p>${graphMini()}<div class="detail-grid"><div><small>Database / schema</small><span>analytics.support</span></div><div><small>Referenced by</small><span>${esc(n.id)} · ${esc(ref.relation)}</span></div></div><div class="callout">Columns: event_id, customer_id, event_time, ingested_at.<br>The note describes this table’s deduplication contract. Its supporting evidence is session S-104; this graph link helps other agents discover the rule when working with the table.</div><p class="muted">Demo metadata only. The prototype does not query Redshift or a live AWS Context graph.</p>`,button('Back to note','note:'+id,'primary'))}
function subscriptionModal(){const sub=P().subscription||{};openModal('Watch changes in this session',`<p class="muted">Board events include content, tag, attribute, and hierarchy changes. Filters combine with AND; leave a filter empty to match all.</p><label class="field"><span>What does your agent need to know?</span><textarea id="sub-intent">${esc(sub.intent||'Tell me when delivery task statuses change so I can unblock the dataset release.')}</textarea></label><label class="field"><span>Folder prefix</span><input id="sub-prefix" placeholder="/delivery" value="${esc(sub.prefix||'')}"></label><label class="field"><span>Tag (without #)</span><input id="sub-tag" placeholder="freshness" value="${esc(sub.tag||'')}"></label><label class="field"><span>Item ID (optional)</span><input id="sub-id" value="${esc(sub.id||'')}"></label><p class="muted">Matches are delivered as passive steering notifications. Leaving the project ends this session’s subscription.</p>`,button('Cancel','close')+button('Watch changes','subscription-save','primary'))}
function notify(note,before=null){const p=P();if(!p.subscribed)return;const sub=p.subscription||{};const match=n=>(!sub.prefix||(n.folder||'/notes')===sub.prefix||(n.folder||'/notes').startsWith(sub.prefix+'/'))&&(!sub.tag||n.tags.includes(sub.tag))&&(!sub.id||n.id===sub.id);if(!match(note)&&!(before&&match(before)))return;p.events.unshift({title:note.title,id:note.id});document.getElementById('notifications').innerHTML=`<div class="notification">${pill('Board event · steering hook','dot')}<button class="icon-btn" style="float:right" data-action="dismiss-notification" aria-label="Dismiss notification">${I('close')}</button><h3>${esc(note.id)} changed</h3><p>${esc(note.title)} · ${esc(note.workStatus||note.status)}</p><p>${esc(sub.intent||'Watching all board changes in this session.')}</p><button class="text-btn" data-action="note:${note.id}">Inspect change ${I('arrow')}</button></div>`;save()}
function renderTurn(who,text){const type=who==='Tool'?'tool':who==='Hook'?'hook':who==='Picker'?'picker':(who==='Claude'||who==='Sub-agent')?'assistant':'user';const label={tool:'●',hook:'↳',picker:'',assistant:'●',user:'❯'}[type];return `<div class="cli-turn ${type}"><span class="turn-label">${label} ${esc(who)}</span><div class="${text.includes('+--')?'ascii-table':''}">${esc(text).replace(/█+/g,x=>`<span class="graph-fill">${x}</span>`).replace(/░+/g,x=>`<span class="graph-empty">${x}</span>`).replace(/PROJECT ·[^|\n]+/g,x=>`<span class="project-label">${x}</span>`).replace(/YOU ·[^|\n]+/g,x=>`<span class="personal-label">${x}</span>`)}</div></div>`}
function sampleSession(i){topTab='cli';cliScene=i;pendingCommand=null;terminalDraft='';const [title,sub,turns,tryCmd]=sampleDefinitions[i];cliOutput=`<div class="sample-transcript">EXAMPLE · ${esc(title)} · illustrative, read-only</div>`+turns.map(([who,text])=>renderTurn(who,text)).join('')+(i===3?button('Explore the project board','nav:board','lime','board'):`<button class="btn lime" data-action="prefill:${encodeURIComponent(tryCmd)}">Try this command in your session ${I('arrow')}</button>`);render();window.scrollTo(0,0);document.getElementById('terminal-output').scrollTop=0}
function reply(text,input){cliOutput=cliOutput.replace(/<div class="decision-options">[\s\S]*?<\/div>/g,'');if(!cliOutput)cliOutput=cliDefault();cliOutput+=renderTurn('You',input)+renderTurn(text.includes('┌─')?'Picker':'Claude',text);if(pendingCommand&&['blueprint','confirm','use'].includes(pendingCommand.step)){const options=pendingCommand.step==='blueprint'?[...blueprints.map(b=>b.name),'Create your own']:pendingCommand.step==='use'?[...state.projects.filter(x=>!x.archived).map(x=>x.name),'Create a new project']:['Create and activate','Revise the goal','Cancel'];cliOutput+='<div class="decision-options">'+options.map((x,i)=>`<button data-action="choose:${i+1}">${i+1}. ${esc(x)}</button>`).join('')+'</div>'}render();requestAnimationFrame(()=>document.getElementById('command')?.focus())}

function nextNoteId(){const p=P();let seq=p.nextNoteSequence||1;while(p.notes.some(n=>n.id==='N-'+seq))seq++;p.nextNoteSequence=seq+1;return 'N-'+seq}
function defaultGuardrails(){return [{name:'Secrets and credentials',kind:'LLM instruction',action:'Exclude',rule:'Exclude passwords, API keys, bearer tokens, private keys, and authentication credentials. Retain schema-level advice without the secret values.'},{name:'Personal identifiers',kind:'LLM instruction',action:'Redact',rule:'Remove names tied to private customer records, personal email addresses, phone numbers, and government identifiers. Preserve aggregate facts and field names.'},{name:'Email addresses',kind:'Regex',action:'Redact',rule:'[\\w.+-]+@[\\w.-]+\\.[a-z]{2,}'},{name:'YubiKey OTP',kind:'Regex',action:'Exclude',rule:'\\b[cbdefghijklnrtuv]{44}\\b'}]}
function guardRules(){return P().guardrailRules||defaultGuardrails()}
function guardrailMatch(text){const exclusions=P().privacy.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);if(exclusions.some(x=>text.toLowerCase().includes(x)))return 'a personal exclusion';for(const r of guardRules()){if(r.kind==='Regex'&&r.rule===defaultGuardrails()[2].rule&&/[\w.+-]+@[\w.-]+\.[a-z]{2,}/i.test(text))return r.name;if(r.kind==='Regex'&&r.rule===defaultGuardrails()[3].rule&&/\b[cbdefghijklnrtuv]{44}\b/.test(text))return r.name;if(r.kind==='LLM instruction'&&r.name==='Secrets and credentials'&&/\b(?:AKIA[A-Z0-9]{16}|sk-[a-zA-Z0-9]{20,})\b/.test(text))return r.name+' (deterministic demo surrogate)';if(r.kind==='LLM instruction'&&r.name==='Personal identifiers'&&/(?:\+?\d[\d ()-]{8,}\d)/.test(text))return r.name+' (deterministic demo surrogate)'}return null}
function readGuardEditor(){return [...document.querySelectorAll('.guard-rule')].map(row=>({name:row.querySelector('[data-g="name"]').value.trim(),kind:row.querySelector('[data-g="kind"]').value,action:row.querySelector('[data-g="action"]').value,rule:row.querySelector('[data-g="rule"]').value.trim()}))}
function guardRow(r){return `<div class="guard-rule"><div class="guard-row-head"><input aria-label="Guardrail name" data-g="name" value="${esc(r.name)}"><select aria-label="Detector type" data-g="kind"><option ${r.kind==='LLM instruction'?'selected':''}>LLM instruction</option><option ${r.kind==='Regex'?'selected':''}>Regex</option></select><select aria-label="Action on detection" data-g="action"><option ${r.action==='Exclude'?'selected':''}>Exclude</option><option ${r.action==='Redact'?'selected':''}>Redact</option></select><button data-action="guard-remove" aria-label="Remove guardrail">×</button></div><textarea aria-label="Detector definition" data-g="rule">${esc(r.rule)}</textarea></div>`}
function guardrailsModal(){openModal('Project guardrails',`<p class="muted">Ordered detectors define what must be excluded or redacted before sharing. Personal exclusions remain additional restrictions.</p><div id="guard-rules">${guardRules().map(guardRow).join('')}</div>${button('Add detector','guard-add')}<label class="field"><span>Preview fictional content</span><textarea id="guard-sample" maxlength="500" placeholder="requester_email = alex@example.com"></textarea></label>${button('Preview detections','guard-test')}<p id="guard-result" class="callout" hidden></p><p class="muted" style="font-size:11px;margin-top:12px">No model runs here. The demo evaluates the built-in email/YubiKey patterns and simple surrogates for the default LLM rules. Custom detectors are saved for illustration, not executed. Matching content is withheld as a whole in this demo.</p>`,button('Cancel','close')+button('Save guardrails','guard-save','primary'),true)}
function privacyReport(){return 'PRIVACY / '+P().name+'\n\n'+guardRules().map((r,i)=>`${i+1}. ${r.name} · ${r.kind} · ${r.action}\n   ${r.rule}`).join('\n\n')+'\n\nEXAMPLE DETECTIONS · prepared, not a live scan\n'+table(['Detector','Observed input','Treatment'],[['Personal identifiers','requester_email value','Redact value; retain field name'],['Secrets and credentials','Authorization bearer token','Exclude credential value'],['YubiKey OTP','44-character modhex token','Exclude matching token']])+'\n\nNo sensitive values are displayed. LLM detection is illustrative.\nPersonal exclusions: '+P().privacy+'\nProject settings → Guardrails to inspect definitions.'}
function suggestions(){const p=P();return `<datalist id="folder-options">${[...new Set(['/notes',...p.notes.map(n=>n.folder).filter(Boolean)])].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="kind-options">${[...new Set(['Decision','Insight','Task','Milestone',...p.notes.map(n=>n.kind)])].map(x=>`<option value="${esc(x)}">`).join('')}</datalist><datalist id="tag-options">${[...new Set(p.notes.flatMap(n=>n.tags))].map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`}
function graphMini(){const nodes=[['support_events_gold',310,145,'Referenced table'],['support_events_raw',95,70,'1 hop · upstream'],['freshness.sql',525,70,'1 hop · quality check'],['analysis agent',525,225,'1 hop · consumer'],['support event stream',95,225,'2 hops · source']];return `<figure class="mini-graph"><svg viewBox="0 0 620 290" role="img" aria-label="Illustrative graph: referenced Redshift table and four neighbors within two hops"><g stroke="#a6bda6" stroke-width="2"><path d="M175 70L230 145M390 145L445 70M390 145L445 225M95 101V193"/></g>${nodes.map(([label,x,y,sub],i)=>`<g><rect x="${x-82}" y="${y-30}" width="164" height="62" rx="9" fill="${i===0?'#dcebd3':'#f3f7f0'}" stroke="#96ad89"/><text x="${x}" y="${y-4}" text-anchor="middle" font-size="11" fill="#2e5130">${label}</text><text x="${x}" y="${y+16}" text-anchor="middle" font-size="9" fill="#6b7b64">${sub}</text></g>`).join('')}</svg><figcaption>Illustrative neighborhood · k = 4 neighbors · at most 2 hops. Edges show upstream, quality-check, and consumer relationships; no live graph query.</figcaption></figure>`}
function naturalCommand(text){if(text.startsWith('/'))return null;let m=text.match(/\b(inspect|revert)\b.*?\b((?:[NSB]-)?\d+)\b/i);if(m){m[2]=/^\d+$/.test(m[2])?'N-'+m[2]:m[2];return {command:'/context '+m[1].toLowerCase()+' '+m[2].toUpperCase(),tool:'context.notes.'+(m[1].toLowerCase()==='inspect'?'read':'revert')+'(id="'+m[2].toUpperCase()+'")'}};m=text.match(/\b(?:correct|update)\s+(?:the\s+)?(?:note\s+)?(N-\d+)\s*(?::|to\s+)(.+)/i);if(m)return {command:'/context correct '+m[1].toUpperCase()+': '+m[2],tool:'context.notes.correct(id="'+m[1].toUpperCase()+'")'};return null}

function attributeRow(key='',value=''){return `<div class="attribute-editor-row"><input data-attr="key" aria-label="Attribute name" placeholder="e.g. severity" value="${esc(key)}"><input data-attr="value" aria-label="Attribute value" placeholder="e.g. high" value="${esc(typeof value==='string'?value:JSON.stringify(value))}"><button data-action="attribute-remove" aria-label="Remove attribute">×</button></div>`}

function cliView(){const p=P();return `<div class="cli-window"><div class="terminal"><div class="terminal-top"><i class="window-dot"></i><i class="window-dot"></i><i class="window-dot"></i><span>claude · ~/workspace/${p.id==='agent-support'?'support-data-product':esc(p.name.toLowerCase().replace(/[^a-z0-9]+/g,'-'))}</span><button data-action="clear-terminal" class="terminal-clear" title="Clear transcript">Clear</button></div><div class="terminal-status"><span>Spindle · ${esc(p.name)}</span><span>${p.archived?'ARCHIVED':p.active?'ACTIVE · project notes shared with members':'INACTIVE · capture off'}</span></div><div class="terminal-body" id="terminal-output" role="log" aria-live="polite" aria-label="Claude Code transcript">${cliOutput||cliDefault()}</div><div class="terminal-input" id="command-form" role="group" aria-label="Terminal input"><span>❯</span><label class="sr-only" for="command">Message Claude Code simulation</label><input id="command" autocomplete="off" placeholder="Ask about this project, or type /context help"><button type="button" data-action="terminal-send">Send ↵</button></div><div class="terminal-help">Interactive simulation · Enter to send · ↑ / ↓ for history · /context help</div></div></div><section class="sample-section"><div class="sample-heading"><div><h2>Explore an example session</h2><p>These transcripts show the workflow. Opening a sample doesn’t change project data; try its command to make a real change in the demo.</p></div>${button('Reset demo','reset')}</div><div class="sample-grid">${sampleDefinitions.map(x=>x.slice(0,2)).map(([title,sub],i)=>`<button class="sample-card ${cliScene===i&&cliOutput?'selected':''}" data-action="sample:${i}"><span>0${i+1}</span><strong>${title}</strong><small>${sub}</small></button>`).join('')}</div><div class="cli-explain"><span>Changes you make here are visible in <button data-action="tab:ui">Spindle UI</button>.</span><span>No live Claude connection · saved in this browser</span></div></section>`}

}`):''}${button('Done','close','primary')}`)},1200);return}if(a==='feedback'){if(p.feedback[id]){toast('Feedback is already recorded for this note.');return}p.feedback[id]=args[1];if(args[1]==='helpful')p.helpful++;else p.notes.find(n=>n.id===id).status='Needs review';save();noteModal(id);toast('Feedback recorded without assuming an outcome.');return}if(a==='retract-note'){openModal('Retract this shared note?',`<p>The note will leave active retrieval. Its history remains available, and related insights will be flagged for review.</p>`,`${button('Cancel','close')}${button('Retract note',`retract-confirm:${id}`,'danger')}`);return}if(a==='retract-confirm'){const n=p.notes.find(n=>n.id===id);n.retracted=true;n.revision++;p.notes.filter(x=>!x.retracted&&x.kind==='Insight'&&x.sources.some(s=>n.sources.includes(s))).forEach(x=>x.status='Needs review');notify(n);closeModal();render();toast('Note retracted; related insights flagged for review.');return}if(a==='correct'){const n=p.notes.find(n=>n.id===id);openModal('Correct your note',`<p class="muted" style="font-size:12px">Preserve the earlier version and the source trail. Dependent insights will be flagged for review.</p><label class="field"><span>Corrected text</span><textarea id="correct-text" maxlength="2000">${esc(n.text)}</textarea></label>`,`${button('Cancel','close')}${button('Save correction',`correct-save:${id}`,'primary')}`);return}if(a==='correct-save'){const text=document.getElementById('correct-text').value.trim();if(!text){toast('Correction text cannot be empty.');return}if(guardrailMatch(text)){toast('Correction blocked by a privacy guardrail.');return}const n=p.notes.find(n=>n.id===id);n.previous=n.text;n.text=text;n.revision++;n.status='Corrected';n.correctedBy='Avery';n.correctionCount=(n.correctionCount||0)+1;p.corrections++;p.notes.filter(x=>x.kind==='Insight'&&x.sources.some(s=>n.sources.includes(s))).forEach(x=>x.status='Needs review');notify(n);render();noteModal(id);toast('New version saved. Related insights need review.');return}if(a==='folder'){folderFilter=args.join(':');render();return}if(a==='subscribe'){if(!p.active&&!p.subscribed){toast('Activate a demo session before subscribing.');return}p.subscribed=!p.subscribed;render();toast(p.subscribed?'Subscribed this demo session to all project-board notes.':'Subscription ended.');return}if(a==='new-note'){if(p.archived){toast('Restore this project before adding notes.');return}newNoteModal();return}if(a==='note-save'){const title=document.getElementById('note-title').value.trim(),text=document.getElementById('note-text').value.trim();const error=document.getElementById('note-error');if(!title||!text){error.textContent='A title and note text are required.';return}let attrs;try{attrs=JSON.parse(document.getElementById('note-attrs').value);if(!attrs||Array.isArray(attrs)||typeof attrs!=='object')throw 0;attrs=extraAttributes(attrs);if(Object.keys(attrs).some(k=>['id','author','project','revision','sources','owner','permissions','__proto__','constructor'].includes(k)))throw 0}catch{error.textContent='Use a JSON object without reserved identity, source, or permission fields.';return}const tags=document.getElementById('note-tags').value.split(',').map(x=>x.trim()).filter(Boolean);const folder=document.getElementById('note-folder').value.trim()||'/notes';if(!/^\/(?:[a-zA-Z0-9_-]+\/?)*$/.test(folder)){error.textContent='Use a path such as /quality/new-checks.';return}const privateContent=[title,text,document.getElementById('note-kind').value,tags.join(' '),JSON.stringify(attrs),folder||''].join(' ').toLowerCase();if(guardrailMatch(privateContent)){error.textContent='This item matches a privacy guardrail or personal exclusion. Remove the sensitive content before sharing.';return}const n={id:nextNoteId(),title,text,kind:document.getElementById('note-kind').value.trim()||'Note',author:'Avery',sources:[],tags,folder,valid:document.getElementById('note-valid').value||'Unknown',status:'Current',uses:0,revision:1,attrs,dependency:document.getElementById('note-dependency').value};p.notes.unshift(n);notify(n);closeModal();render();toast('Authored note shared with project members.');return}if(a==='move'){const n=p.notes.find(n=>n.id===id);openModal('Move the note, keep the context.',`<label class="field"><span>Folder</span><input id="move-folder" list="folder-options" value="${esc(n.folder||'/notes')}" placeholder="Type a new /folder/path">${suggestions()}</label><p class="muted" style="font-size:12px">Its ID, content, authorship, and source lineage stay the same.</p>`,`${button('Cancel','close')}${button('Save placement',`move-save:${id}`,'primary')}`);return}if(a==='move-save'){const n=p.notes.find(n=>n.id===id);const before={...n};const path=document.getElementById('move-folder').value.trim()||'/notes';if(!/^\/(?:[a-zA-Z0-9_-]+\/?)*$/.test(path)){toast('Use a path such as /quality/new-checks.');return}n.folder=path;n.revision++;notify(n,before);render();noteModal(id);return}if(a==='run-night'){if(p.archived){toast('Restore the project before running maintenance.');return}p.nightDone=true;render();openModal('Demo maintenance check complete',`<p>Reviewed the prepared ETL examples for stale guidance, duplicate notes, conflicting definitions, sensitive content, and blocked work.</p><div class="callout">No notes were changed. Inspect each linked item before proposing a correction. This is a local demonstration, not a model run.</div>`,button('Review the checks','close','primary'));return}if(a==='review'){const n=p.notes.find(n=>n.id===id);n.reviewed=true;render();toast('Marked reviewed, not automatically confirmed true.');return}if(a==='steering'){openModal('Give Night Shift a focus.',`<label class="field"><span>What deserves extra attention?</span><textarea id="night-focus">${esc(p.steering)}</textarea></label><p class="muted" style="font-size:12px">Instructions guide attention. They cannot override privacy or invent progress.</p>`,`${button('Cancel','close')}${button('Save focus','steering-save','primary')}`);return}if(a==='steering-save'){p.steering=document.getElementById('night-focus').value;closeModal();render();toast('Night Shift focus updated.');return}if(a==='dismiss-notification'){document.getElementById('notifications').innerHTML='';return}if(a==='reset'){openModal('Reset this demo?',`<p>Clear changes made in this browser and return to the original sample project.</p>`,`${button('Cancel','close')}${button('Reset demo','reset-confirm','danger')}`);return}if(a==='reset-confirm'){clearTimeout(runTimer);state=seed();uiSelected=false;pendingCommand=null;terminalDraft='';cliOutput='';cliScene=0;query='';noteFilter='All notes';folderFilter='/';tagFilter='';closeModal();document.getElementById('notifications').innerHTML='';render();toast('Demo reset.');return}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(b?.dataset.action==='attribute-remove'){b.closest('.attribute-editor-row').remove();return}if(b?.dataset.action==='guard-remove'){b.closest('.guard-rule').remove();return}if(b)act(b.dataset.action);else if(e.target.classList.contains('backdrop'))closeModal()});
document.addEventListener('keydown',e=>{if(e.target.id==='command'&&e.key==='Enter'&&!e.isComposing){e.preventDefault();terminalSend();return}if(e.target.id==='command'&&(e.key==='ArrowUp'||e.key==='ArrowDown')){e.preventDefault();historyCursor=Math.max(0,Math.min(commandHistory.length,historyCursor+(e.key==='ArrowUp'?-1:1)));e.target.value=commandHistory[historyCursor]||'';terminalDraft=e.target.value;return;}if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"][data-action]')){e.preventDefault();act(e.target.dataset.action)}if(e.key==='Tab'&&document.querySelector('.modal')){const els=[...document.querySelectorAll('.modal button,.modal input,.modal textarea,.modal select,.modal summary')].filter(x=>!x.disabled&&x.getClientRects().length);const first=els[0],last=els.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('input',e=>{if(['note-tags','meta-tags'].includes(e.target.id)){const value=e.target.value,cut=value.lastIndexOf(',');const prefix=cut<0?'':value.slice(0,cut+1)+' ';const list=document.getElementById('tag-options');if(list)list.innerHTML=[...new Set(P().notes.flatMap(n=>n.tags))].map(t=>`<option value="${esc(prefix+t)}">`).join('')}if(e.target.id==='board-search'){query=e.target.value;boardPage=0;const caret=e.target.selectionStart;render();const el=document.getElementById('board-search');el.focus();el.setSelectionRange(caret,caret);return}if(e.target.id==='command')terminalDraft=e.target.value;if(e.target.id==='note-search'){query=e.target.value;document.getElementById('note-results').innerHTML=noteResults()}});
