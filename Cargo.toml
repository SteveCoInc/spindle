[workspace]
members = ["crates/factory", "crates/api"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
